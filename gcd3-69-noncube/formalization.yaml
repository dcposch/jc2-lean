# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "jc2-gcd3-69-noncube-reduction"
  description: >-
    Lean 4 / Mathlib formalization of the exact two-sheet reduction in the
    aligned nontrivial cubic-Kummer analysis at actual partial degrees (6,9).
    The four lower-Pfaffian invariant equations are proved to have exactly two
    field-valued reduced branches: a common-power sheet with zero source
    bracket and an elliptic sheet.  The formalization derives the elliptic
    equation and terminal one-form, excludes its C != 0 fibre by a finite
    forbidden-value argument, factors the C=0 fibre, and verifies the shifted
    Davenport--Stothers bracket, terminal descent, infinity arithmetic, and
    one-root cube conclusion.  It does not formalize the remaining
    finite-place valuation classification and therefore does not claim the
    full noncube branch, all (6,9), maximum eleven, or JC2.
  authors:
    - "Dan Clemens Posch"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Dan Clemens Posch"

classification:
  arxiv: ["math.AG", "math.AC"]
  msc2020: ["14R15", "13P10"]


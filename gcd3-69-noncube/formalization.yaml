  notes: >-
    The copied hostile review independently reconstructs the informal
    mathematics but predates and does not inspect the Lean code.  Kernel axiom
    reports and the project audit script find no sorryAx or non-permitted
    axioms in Solution.lean.

alignment:
  namespace: "(root)"
  statements:
    - source: "Normalized common-cubic noncube gate at partial degrees (6,9)"
      lean: "GCD369PolynomialNoncubeSourceExclusion"
      module: "Challenge"
      status: >-
        literal bivariate source data construct their own cubic-Kummer field,
        affine alignment, weights, high-row normal form, rational descents,
        and complete lower-sheet contradiction
    - source: "First common-cubic gate, equations (1.7)--(1.11)"
      lean: "GCD369KummerHighRowsNormalize"
      module: "Challenge"
      status: >-
        all eight triangular high bracket rows are integrated; Kummer weights
        kill the five nonzero-weight constants; the surviving constants are
        identified as target shear, kappa, and target translation
    - source: "Charged noncube landing, complete differential Kummer package"
      lean: "GCD369PolynomialNoncubeDifferentialKummerPackage"
      module: "Challenge"
      status: >-
        polynomial noncubeness constructs the irreducible differential Kummer
        extension, deck action, constant descent, and first-row alignment
    - source: "Charged noncube landing, standard differential on k(x)"
      lean: "GCD369RatFuncDerivative"
      module: "Challenge"
      status: >-
        a quotient-rule differential instance is constructed, differentiates
        embedded polynomials ordinarily, and has constants exactly k
    - source: "Charged noncube landing, rational base constant field"
      lean: "GCD369RatFuncConstantsOfPolynomialDerivative"
      module: "Challenge"
      status: >-
        reduced numerator/denominator coprimality and degree descent prove
        that the standard derivative on k(x) has no constants outside k
    - source: "Noncube alignment from the rational base constant field"
      lean: "GCD369KummerAlignmentFromBaseConstants"
      module: "Challenge"
      status: >-
        the first source row gives alignment from base constant descent and a
        base-fixing algebraic Kummer deck action, with no separate hypothesis
        that the deck action fixes extension constants
    - source: "Charged noncube landing, constant-field descent"
      lean: "GCD369BaseFixingAutomorphismFixesConstants"
      module: "Challenge"
      status: >-
        constants descend through algebraic differential extensions over an
        algebraically closed base, hence base-fixing Kummer deck actions fix
        every differential constant
    - source: "Charged noncube landing, differential Kummer structure"
      lean: "GCD369KummerDeckCommutesWithDerivative"
      module: "Challenge"
      status: >-
        canonical root derivative and commutation of the Kummer deck action
        with the separable differential extension are proved
    - source: "Charged noncube landing, polynomial core to rational Kummer data"
      lean: "GCD369PolynomialNoncubeKummerExtension"
      module: "Challenge"
      status: >-
        reduced-fraction descent and the concrete cubic Kummer extension are
        composed directly from polynomial noncubeness
    - source: "Charged noncube landing, cubic Kummer extension and deck action"
      lean: "GCD369NoncubeCubicKummerExtension"
      module: "Challenge"
      status: >-
        irreducibility, nonzero cubic root, and nontrivial base-fixing deck
        action constructed from field-level noncubeness
    - source: "Noncube alignment, equations (3.1) and the first denominator-cleared row"
      lean: "GCD369KummerAlignmentFromFirstRow"
      module: "Challenge"
      status: >-
        differential constancy and nontrivial cubic-Kummer weight-one
        vanishing proved from the displayed first source row and deck action
    - source: "Aligned noncube branch, equations (5)--(21)"
      lean: "GCD369AlignedNoncubeExclusion"
      module: "Challenge"
      status: >-
        actual bracket-to-invariant landing, two-sheet dispatch, elliptic
        exclusions, special-fibre reduction, and shifted-DS noncube
        contradiction proved under the displayed aligned/Kummer and reduced
        function-field hypotheses


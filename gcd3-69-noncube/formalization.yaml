version: "v0.4"

project:
  name: "jc2-gcd3-69-aligned-noncube-exclusion"
  description: >-
    Lean 4 / Mathlib proof of the aligned noncube exclusion at actual partial
    degrees (6,9).  From the actual aligned Keller bracket and explicit
    cubic-Kummer/function-field hypotheses, the formalization extracts the
    four lower rows, derives the invariant two-sheet split, and excludes the
    zero sheet, all nonzero elliptic trajectories, and the special shifted
    Davenport--Stothers fibre.  It does not claim the cube branch, all (6,9),
    maximum eleven, or the plane Jacobian conjecture.
  authors:
    - "Dan Clemens Posch"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Dan Clemens Posch"

classification:
  arxiv: ["math.AG", "math.AC"]
  msc2020: ["14R15", "13P10"]


    yet occurred.

fidelity:
  divergences: >-
    (1) GCD369InvariantFibreDichotomy states the exact field-valued reduced
    point dichotomy implied by the source's radical equality; it does not
    formalize equality of ideals, primary components, or the embedded
    nonreduced component.  (2) GCD369EllipticNonzeroExclusion presents a
    rational function by numerator and denominator and assumes no common
    finite root.  Instead of the source's valuation at the forbidden value,
    it uses direct evaluation there; the hypotheses ensure the denominator is
    nonzero, and the resulting contradiction is stronger but has the same
    scope, including ramification.  (3) GCD369EllipticTerminalForm takes the
    elliptic curve and tangent equations explicitly.  (4) The shifted
    Davenport--Stothers bracket doubles the degree-nine polynomial to remove
    the coefficient 63/2, so its bracket constant is 1134 rather than 567.
    (5) The finite-place valuation step from the descended rational ODE to the
    exponent classification remains unformalized; only the subsequent
    infinity-support and cube conclusions are proved.  No other divergences
    are known.


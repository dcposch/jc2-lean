status:
  scope: >-
    Fully proved under the displayed aligned/Kummer and reduced rational
    presentation hypotheses: the first denominator-cleared source row makes
    the alignment discriminator differential-constant and the nontrivial
    Kummer action forces it to vanish; extraction of all four lower rows from
    the actual Keller bracket; first-integral and invariant-fibre landing; zero
    bracket and terminal exclusion on P_A; the P_B elliptic equation and
    actual terminal row; exclusion of constant and nonconstant trajectories
    on C != 0; the C=0 factorization; shifted Davenport--Stothers terminal
    descent and complete rational valuation closure; and contradiction of the
    noncube core.  Not proved: construction of the aligned/Kummer presentation
    from every arbitrary Keller pair, the cube-core branch, all (6,9), maximum
    eleven, or any larger Jacobian-conjecture claim.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "GCD369KummerAlignmentFromFirstRow"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
    - declaration: "GCD369AlignedNoncubeExclusion"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"


version: "v0.4"

project:
  name: "jc2-gcd3-69-noncube-reduction"
  description: >-
    Lean 4 / Mathlib formalization of a two-sheet implication in the
    aligned nontrivial cubic-Kummer analysis at actual partial degrees (6,9).
    Every field-valued solution of the four lower-Pfaffian invariant equations
    is proved to lie on a common-power sheet with zero source bracket or on an
    elliptic sheet; converse inclusions and existence of the sheets are not
    compared.  The formalization derives the elliptic equation and terminal
    one-form, excludes nonconstant reduced rational trajectories on its
    C != 0 fibre by a finite forbidden-value argument, factors the C=0 fibre,
    and verifies the shifted Davenport--Stothers bracket and terminal descent.
    Version 2 derives the finite-place valuation classification directly from
    the reduced rational ODE, proves the one-point support theorem, and
    excludes that sheet in the noncube Kummer branch.  It does not claim the
    preceding landing from an arbitrary Keller pair, the cube branch, all
    (6,9), maximum eleven, or JC2.
  authors:
    - "Dan Clemens Posch"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Dan Clemens Posch"


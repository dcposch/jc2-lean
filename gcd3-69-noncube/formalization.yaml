version: "v0.5"

project:
  name: "jc2-gcd3-69-source-noncube-exclusion"
  description: >-
    Lean 4 / Mathlib proof of the source-facing noncube exclusion at actual
    partial degrees (6,9).  From literal bivariate polynomials of outer
    degrees six and nine, leading coefficients H^2 and H^3, and nonzero
    constant Keller bracket, the formalization constructs the differential
    cubic-Kummer extension, affine alignment, coefficient weights, high-row
    normal form, and reduced rational presentations.  It derives the
    invariant two-sheet split and excludes the zero, elliptic, and shifted
    Davenport--Stothers sheets.  It does not claim the cube branch, all
    (6,9), maximum eleven, or the plane Jacobian conjecture.
  authors:
    - "Dan Clemens Posch"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Dan Clemens Posch"


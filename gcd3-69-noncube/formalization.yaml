status:
  scope: >-
    Fully proved for a literal normalized source p,q in k[x][y] over an
    algebraically closed characteristic-zero field: outer degrees 6 and 9,
    leading coefficients H^2 and H^3, nonzero constant coefficientwise-inner
    Keller bracket, noncube H, and 3 dividing deg H are contradictory.  The
    proof internally constructs a primitive cubic root, the irreducible
    differential Kummer extension and deck action, constant-field descent,
    simultaneous affine depression, deck coefficient weights, triangular
    integration of all eight high rows, the lower invariant-fibre split, and
    canonical reduced rational presentations for both descended quantities.
    It excludes the zero sheet, constant and nonconstant elliptic fibres, and
    the shifted Davenport--Stothers special fibre.  Not proved: reduction of
    every arbitrary Keller pair to these normalized common-cubic hypotheses,
    the cube-core branch, all (6,9), maximum eleven, or any larger
    Jacobian-conjecture claim.

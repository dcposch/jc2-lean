fidelity:
  divergences: >-
    (1) The theorem begins with the aligned normal form and explicit
    cubic-Kummer/function-field data; it does not construct these from every
    arbitrary Keller pair.  (2) Rational functions are presented by reduced
    numerator/denominator pairs over an algebraically closed constant field.
    The nonzero elliptic exclusion uses direct evaluation at a forbidden value
    rather than the source's equivalent local-valuation phrasing; constant
    trajectories are handled separately from the uncleared Keller row.
    (3) The shifted
    Davenport--Stothers bracket doubles the degree-nine polynomial to remove
    the coefficient 63/2, so its bracket constant is 1134 rather than 567.
    (4) The valuation theorem explicitly assumes the effective-domain
    condition `B != 0`.
    Pointwise reducedness means every zero of `N` is not a zero of `B`; the
    theorem first proves `N` constant and then works entirely with
    polynomial root multiplicities.  This is the global polynomial form of
    the source's finite valuations.  No other divergences are known.


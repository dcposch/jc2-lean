    authors:
      - "Dan Clemens Posch"
    type: "other"
    location: "sources/gcd3-69-lower-pfaffian-successor-20260824.md"
    relationship: "formalizes"
    note: >-
      Exact frozen campaign report for the invariant fibre, its two reduced
      sheets, the elliptic terminal obstruction, and the shifted
      Davenport--Stothers valuation endgame.  The source is included
      byte-for-byte in this public project; its original SHA-256 is recorded
      in README.md.  The Lean project formalizes the algebraic decomposition,
      the complete C != 0 exclusion, and the displayed special-fibre/endgame
      identities, but not the finite-place valuation classification.
    license: "CC-BY-4.0"
    author_endorsement: "participated"
  - title: "Hostile different-model review: GCD3 (6,9) lower-Pfaffian successor"
    authors:
      - "Grok 4.6 review agent under the JC2 campaign"
    type: "other"
    location: "sources/gcd3-69-lower-pfaffian-successor-review-grok-20260824.md"
    relationship: "background"
    note: >-
      Campaign-internal independent reconstruction and scope audit of the
      informal source, copied byte-for-byte.  It is not an external human peer
      review and does not review this Lean extraction.
    license: "CC-BY-4.0"
    author_endorsement: "n/a"

status:
  scope: >-
    Fully proved: the field-valued invariant-fibre dichotomy; zero bracket on
    the P_A sheet; the P_B elliptic equation and terminal form; exclusion of
    the C != 0 rational elliptic sheet; the C=0 factorization; the shifted
    Davenport--Stothers bracket and terminal descent; and the final infinity
    support and one-root cube arithmetic.  Not proved: derivation of the
    finite-place exponent classification from the rational ODE, hence the
    complete aligned noncube exclusion and every larger Jacobian-conjecture
    claim.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "GCD369InvariantFibreDichotomy"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
    - declaration: "GCD369EllipticNonzeroExclusion"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
    - declaration: "GCD369SpecialFibreDichotomy"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"


fidelity:
  divergences: >-
    (1) GCD369InvariantFibreDichotomy states only the field-valued implication
    from the four invariant equations to the displayed sheet disjunction; it
    does not formalize either converse inclusion, existence of points on both
    sheets, equality of ideals, primary components, or the embedded nonreduced
    component.  (2) GCD369EllipticNonzeroExclusion presents a nonconstant
    rational function by numerator and denominator and assumes no common
    finite root.  Instead of the source's valuation at the forbidden value,
    it uses direct evaluation there; the hypotheses ensure the denominator is
    nonzero, and the resulting contradiction includes ramified preimages but
    does not exclude constant trajectories.  (3) GCD369EllipticTerminalForm takes the
    elliptic curve and tangent equations explicitly.  (4) The shifted
    Davenport--Stothers bracket doubles the degree-nine polynomial to remove
    the coefficient 63/2, so its bracket constant is 1134 rather than 567.
    (5) The v2 valuation theorem uses a reduced polynomial presentation
    `q=N/B` over an algebraically closed characteristic-zero coefficient
    field, and explicitly assumes the effective-domain condition `B != 0`.
    Pointwise reducedness means every zero of `N` is not a zero of `B`; the
    theorem first proves `N` constant and then works entirely with
    polynomial root multiplicities.  This is the global polynomial form of
    the source's finite valuations.  (6) The headline exclusion begins with
    the cleared shifted-DS ODE; it does not itself derive that parametrization
    from an arbitrary Keller pair.  No other divergences are known.


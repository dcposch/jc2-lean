    noncube Kummer hypothesis.  Not proved: converse inclusions or existence
    for the two displayed sheets; exclusion of constant C != 0 trajectories;
    the preceding landing from every aligned Keller pair into the shifted DS
    parametrization; the cube-core branch; or any larger Jacobian-conjecture

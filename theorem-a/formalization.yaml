  statements:
    - source: >-
        Theorem A, label thm:ode ("ODE rigidity, all weights"; Theorem 6.1
        in the current compilation), Section 6 of the campaign paper;
        MATHIEU.md Section 5.1 of the archived theory bundle
      lean: "TheoremA"
      module: "Challenge"
      status: "proved"
      note: >-
        Same statement over an integral domain instead of a field (a
        strengthening); degree as natDegree; the weight nu enters as a
        natural number cast into F[y].
    - source: >-
        Section 6 closing positive-characteristic remark (bound
        p > (k+1)*d2) of the campaign paper; MATHIEU.md Section 5.4
      lean: "TheoremA_charP"
      module: "Challenge"
      status: "proved (adapted: standalone strengthening extracted from the source)"
      note: >-
        A standalone strengthening extracted from the source's proof and
        remark, not displayed verbatim there; the source's conservative
        bound implies the two formalized degree hypotheses in its
        application.  Proved sorry-free in Solution.lean.
  # The same two declarations appear verbatim in Solution.lean with proofs;

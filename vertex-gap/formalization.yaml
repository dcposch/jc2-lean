        Claude agent against the pinned Mathlib, using the paper's proof of
        Theorem 3.4 as specification; the twelve key equations and the
        elimination cascade were first re-verified by the agent with an
        independent exact-arithmetic enumeration over a large prime field
        before being formalized; machine-checked by the Lean kernel via
        lake build, with an axiom audit script.
      cost:
        wall_time: "under one day of agent time"
        spend_usd: "subscription-based"
        hardware: "local machine (macOS, elan/lake)"
      prompting_notes: >-
        Campaign-directed prompt supplying the paper source and Palomar's
        submission constraints; the agent chose the self-contained
        polynomial/support-combinatorics core per the campaign's scoping
        instruction (semantic fidelity over coverage).
    - method: "manual"
      models: []
      framework: "n/a"
      tool_setup: >-
        Human campaign direction, mathematical review of the informal
        proof, statement audit of Challenge.lean, and final submission
        review.
      cost:
        wall_time: "a few hours of human review"
        spend_usd: "not tracked"
        hardware: "local machine"
      prompting_notes: "n/a"
  spend_usd: "subscription-based"
  notes: >-
    Proofs were drafted by a Claude (Fable) agent in a human-directed
    research campaign; the informal theorem and proof had previously passed
    campaign-internal adversarial review (independent AI re-derivations,
    exact-arithmetic replays, and the two corrections - side-symmetry and

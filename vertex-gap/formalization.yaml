    formalization is machine-checked; the human author reviewed the
    statements and takes responsibility.

fidelity:
  divergences: >-
    (1) Labels: the paper states Theorem 3.4 after normalizing the labels
    of the pair (Lemma 2.2 plus the swap (P,Q) -> (Q,-P)); VertexGap22 is
    the normalized-label statement and VertexGap22_swapped the mirrored
    one, so the pair of theorems is the side-symmetric content of the
    printed theorem.  (2) The Newton-polygon hypotheses (S1)-(S3) and (i)
    of the source are rendered as explicit lattice-support inequalities:
    P in the strip 0 <= 2i-j <= 2, Q in the strip 0 <= 2i-j <= 3 together
    with i <= 2j.  The last inequality (support of the wide member on or
    above the line through (0,0) and its bottom corner (2,1)) is carried
    in the paper by the polygon shape - "the points of a gap column lie
    strictly above the bottom edge" of N(Q), whose bottom edge runs from
    (0,0) to (k,1) - rather than by a displayed inequality; it is
    load-bearing for the gap kill and is made explicit here.  (3) The
    saturation clause of (S2) (nonvanishing bottom-corner coefficients)
    and the uniqueness clause of (i) are not assumed: with the support
    inequalities they are consequences (the vertex equation
    a_{(1,0)}*b_{(2,1)} = 1 is derived from the bracket), so the
    formalized statement is harmlessly stronger.  Strip lengths are
    unconstrained, covering the paper's "strips of any lengths containing
    the block columns".  (4) "Characteristic not in {2,3,5}" is rendered
    as (2:K) != 0, (3:K) != 0, (5:K) != 0, equivalent for fields.  The
    formalized cascade in fact consumes only the invertibility of 2 and 3
    (it keeps the factor 5 on the b9-pivot instead of dividing by it);
    (5:K) != 0 is retained in the statements for fidelity with the print
    but is unused by the proof - consistent with Remark 3.7, which
    observes (without claim) that the obstruction appears to persist mod
    5, and which claims sharpness of {2,3,5} only for the paper's own
    pivot derivation.  (5) The conclusion is the variety-level statement
    of Theorem 3.4 (every solution satisfies a3 = 0 and a2^2*a6 = 0); the
    scheme-level refinement of Remark 3.5 (u^2 in the block ideal but u
    not in it) is not formalized.  (6) CornerEnumeration is stated for all
    natural k (the paper's context has k >= 1; the statement also holds at
    k = 0) and omits the unused uniqueness clause of hypothesis (i).
    No other divergences known.

review:
  status: >-
    self-assessed; statements audited against the source by the human
    author; the informal theorem previously passed campaign-internal
    adversarial review (independent AI re-derivations and exact-arithmetic
    replays); not yet externally peer-reviewed
  reviewers:
    - "Dan Clemens Posch"
  notes: >-
    The key equations and the cascade formalized here were re-checked
    during formalization by an independent random-evaluation enumeration
    over a large prime field (all twelve keys and the identically-zero
    top stratum matched the bracket coefficients; the cascade's
    consistency and both obstruction events reproduced).  The Lean proofs
    are kernel-checked; kernel-only (no native_decide), axioms exactly
    propext, Classical.choice, Quot.sound.

alignment:
  namespace: "(root); helper lemmas live in JC72108.VertexGap inside Solution.lean"
  statements:
    - source: >-
        Lemma 2.2 (label lem:enum), Section 2 of the campaign paper
      lean: "CornerEnumeration"
      module: "Challenge"
      status: "proved"
      note: >-
        Stated for all k : Nat (source context has k >= 1); the unused
        uniqueness clause of hypothesis (i) is omitted.
    - source: >-
        Hypothesis (ii) (gap condition), Section 2, in the side-symmetric
        form required by the erratum recorded in Section 8
      lean: "GapConditionSideSymm"
      module: "Challenge"
      status: "proved"
    - source: >-
        Theorem 3.4 (label thm:22, "vertex-gap obstruction,
        (k,d2) = (2,2)"), Section 3, in the paper's normalized labels
      lean: "VertexGap22"
      module: "Challenge"
      status: "proved"
      note: >-
        Newton-polygon hypotheses as explicit support inequalities;
        saturation derived, not assumed; (5:K) != 0 retained but unused by
        the formal proof; conclusion at variety level.
    - source: >-
        Theorem 3.4, mirrored labels (the paper's normalization
        (P,Q) -> (Q,-P), Section 2, run in reverse)
      lean: "VertexGap22_swapped"
      module: "Challenge"
      status: "proved (adapted: the side-symmetric companion statement)"
  # The same four declarations appear verbatim in Solution.lean with
  # proofs; comparator.json compares them.


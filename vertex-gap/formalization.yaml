# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4
version: "v0.4"

project:
  name: "jc2-vertex-gap"
  description: >-
    Lean 4 / Mathlib formalization of the vertex-gap obstruction at
    (k,d2) = (2,2) (label thm:22, Theorem 3.4 in the current compilation)
    from the campaign paper "A Vertex-Gap Obstruction for Low-Degree Strip
    Pairs in the Plane Jacobian Conjecture": for polynomials P, Q in K[x,y]
    over a field K of characteristic not in {2,3,5}, supported in the
    normalized type-(2,2) Newton strips along (1,2) with [P,Q] = x^2, the
    block coefficients satisfy a3 = 0 and a2^2*a6 = 0 - so the generic
    chart a2*a6 != 0 of the strip family is empty (VertexGap22, plus the
    side-symmetric companion VertexGap22_swapped in the mirrored labels).
    Also formalized: the arithmetic corner-enumeration lemma behind the
    vertex normalization (lem:enum, Lemma 2.2; CornerEnumeration) and the
    side-symmetric form of the gap condition, hypothesis (ii) as corrected
    by the erratum recorded in Section 8 (GapConditionSideSymm).  The
    theorem is the mechanism that empties the generic chart of the (8,28)
    strip subcase in the campaign on the plane Jacobian problem at
    Newton-degree pair (72,108).
  authors:
    - "Dan Clemens Posch"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Dan Clemens Posch"

classification:
  arxiv: ["math.AG", "math.AC"]
  msc2020: ["14R15"]

sources:
  - title: >-
      A Vertex-Gap Obstruction for Low-Degree Strip Pairs in the Plane
      Jacobian Conjecture (campaign paper, archived with its reproduction
      artifact "Artifact for: A Vertex-Gap Obstruction for Low-Degree Strip
      Pairs in the Plane Jacobian Conjecture")
    authors:
      - "Dan Clemens Posch"
    id: "doi:10.5281/zenodo.21894922"
    type: "working paper (archived with the campaign reproduction artifact)"
    location: >-
      Theorem 3.4 (label thm:22) and its proof, Section 3; Definition 2.1
      (def:strip), Lemma 2.2 (lem:enum) and hypotheses (i)/(ii), Section 2;
      Remark 3.5 (radical membership) and Remark 3.7 (excluded primes),
      Section 3; erratum record ("the gap condition must be stated
      side-symmetrically"), Section 8
    relationship: "formalizes"
    note: >-
      VertexGap22 formalizes Theorem 3.4 in the paper's normalized labels
      (bottom corner (1,0) on the P side), with the Newton-polygon
      hypotheses rendered as explicit lattice-support inequalities;
      VertexGap22_swapped is the side-symmetric companion (corner (1,0) on
      the Q side), whose proof is the paper's label normalization
      (P,Q) -> (Q,-P).  CornerEnumeration is Lemma 2.2 verbatim (stated for
      all k, including k = 0; the paper's context has k >= 1).
      GapConditionSideSymm is hypothesis (ii) in the side-symmetric form
      required by the erratum.  See the fidelity section for the exact
      divergences.
    license: "MIT"
    author_endorsement: "participated"
  - title: >-
      Sheet-number obstruction theory for the plane Jacobian Conjecture:
      campaign theory bundle v1
    authors:
      - "Dan Clemens Posch"
    id: "doi:10.5281/zenodo.22002825"
    type: "working paper (archived campaign theory bundle)"
    location: "SURPLUS.md and LEMMA.md (campaign-internal form of the theorem and its reviews)"
    relationship: "background"
    note: >-
      The campaign-internal write-up and adversarial reviews of the same
      obstruction (surplus relation, radical-membership erratum,
      side-symmetry correction) that became Sections 2-3 of the paper.
    license: "CC-BY-4.0"
    author_endorsement: "participated"
  - title: >-
      Increasing the degree of a possible counterexample to the Jacobian
      conjecture from 100 to 108
    authors:
      - "J. A. Guccione"
      - "J. J. Guccione"
      - "R. Horruitiner"
      - "C. Valqui"
    id: "arXiv:2204.14178v1"
    type: "article (arXiv preprint, 2022, unrefereed; version pinned at v1)"
    location: "Proposition 4.3"
    relationship: "background"
    note: >-
      Source of the strip families to which the theorem is applied in the
      campaign (subcase (2) at Newton-degree pair (72,108)).  The
      formalized theorems are unconditional statements about strip pairs
      and do not depend on this reduction; only the campaign application
      inherits it.
    license: "unknown"
    author_endorsement: "not-contacted"

related_formalizations:
  - id: "jc72108-theorem-a"
    note: >-
      Sibling Palomar project (theorem-a/ in the same repository): Theorem A
      (ODE rigidity), the rigidity engine of the depth-two block analysis of
      the same campaign, pinned to the same Lean/Mathlib toolchain.

status:
  scope: >-
    Fully formalized and proved: the (2,2) vertex-gap obstruction
    (VertexGap22 and its side-symmetric companion VertexGap22_swapped, both
    at polynomial level with the Jacobian bracket hypothesis [P,Q] = x^2
    stated via MvPolynomial.pderiv), the corner-enumeration lemma
    (CornerEnumeration = lem:enum), and the side-symmetric gap condition
    (GapConditionSideSymm = hypothesis (ii) per the erratum).  Inside the
    proof, the vertex equation, the gap kill, and all nine block keys of
    the (2,2) cell are derived from the bracket, and the paper's
    elimination cascade (cancellations C1/C2, the rigidity event a3 = 0,
    the pinning surplus) is certified by explicit linear_combination
    steps.  NOT formalized: the general-cell counting propositions
    (Propositions 3.2 and 3.3), the gap-kill lemma at general (k,d2)
    (only its (2,2) instances appear, inside the proof), the scheme-level
    radical-membership refinement (Remark 3.5), the (2,3)/(2,4) variants
    and k >= 3 rigidity certificates (Section 4), the (8,28) worked
    example (Section 5), the log-residue functional and block-variety
    theorem (Section 6), the GGHV chart reduction and the (72,108)
    application (Sections 7-8).
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []


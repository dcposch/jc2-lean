  namespace: "(root)"
  statements:
    - source: "Finite routing table and recursive closure, Sections 6--8"
      lean: "MaxPartialDegreeElevenClosure"
      module: "Max11Assembly"
      status: >-
        exact abstract recursion proved; Keller-pair route theorems remain
        hypotheses
    - source: "Maximum actual partial y-degree eleven theorem, Sections 1 and 6"
      lean: "Max11DegreeRoutes.Max11PlaneKellerGenerationWithFiveNormalizedLowScaleRoutes"
      module: "Max11Challenge"
      status: >-
        exact bivariate polynomial conclusion and finite composition proved;
        the zero, equal-degree, divisibility, exhaustive (6,9), coprime-degree,
        odd-scale gcd-two, and large-even-scale adapter routes are proved; the
        prime-total-degree-gcd theorem, standard-pair endpoint obstruction, and
        normalized scales zero and two at the four explicit gcd-two degree
        pairs other than the completely proved `(4,6)` pair remain as
        hypotheses; the `(6,8)` scale-zero proof is internally advanced through
        its canonical nontrivial expanded polynomial cubic-core boundary,
        strict transverse degree drop, exact-cubic contradiction, and attained
        positive secondary defect radius; all five equations of its abstract
        `2g<n` face are extracted and applied to the canonical expanded system,
        reducing the attained residual boundary to `B` or translated `C`

version: "v0.4"

project:
  name: "jc2-max11-partial-y-degree-closure"
  description: >-
    Lean 4 / Mathlib proof of the exact finite degree-routing certificate
    through maximum partial y-degree eleven, both abstractly and instantiated
    for bivariate polynomials with nonzero constant Jacobian.  The concrete
    strengthened characteristic-zero theorem proves the zero-degree,
    equal-degree, and divisibility routes internally and concludes
    K[P,Q]=K[x,y] from only the gcd-at-most-two and (6,9) route premises.
    A further source-facing theorem replaces the (6,9) premise by exhaustive
    normalized cube-core and noncube-core closure premises.  The imported
    divisible-core assembly discharges both deep exclusions.  The local
    source-shear, exact total-degree, and Dirichlet argument now reduce the
    nondivisible history route to the canonical prime-total-degree-gcd theorem,
    while a generic leading-degree/source-shear argument proves every coprime
    partial-degree pair and the odd-common-scale half of gcd two from the same
    prime theorem.  The narrowest final inputs are that theorem and the even
    common-leading-scale residue at partial-degree gcd two.
  authors:
    - "Dan Clemens Posch"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Dan Clemens Posch"


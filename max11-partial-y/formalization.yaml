      byte-for-byte.  It is not an external human review and does not review
      this Lean extraction.
    license: "CC-BY-4.0"
    author_endorsement: "n/a"
  - title: "Source-shear, common-core normalization, and low-scale Max-11 development"
    authors:
      - "Dan Clemens Posch"
    type: "original-proof"
    relationship: "other"
    note: >-
      These results are first presented by this Lean formalization rather than
      imported from a prior paper or sibling proof.  The source-shear modules
      give the exact bridge from partial y-degree to the published total-degree
      theorems; the UFD and target-rescaling modules normalize the five
      gcd-two leaves; and the `(4,6)` modules give a new complete proof of both
      low scales.  The `(6,8)` modules extend that original development through
      the canonical nontrivial expanded weighted-boundary cubic-core theorem,
      strict transverse degree drop, exact-cubic contradiction, and attained
      positive secondary defect radius.  The first abstract secondary chamber
      is classified exactly; both invariant equations and all three one-form
      equations are extracted from the literal polynomial system and applied
      to the canonical expanded lower system.  In the chamber `2g<n`, the
      resulting boundary has `e=0`, `a*b=3*d`, and attained support only in
      the `B` or translated-`C` direction.  The abstract algebra of the next
      prospective residual faces in `3g<n` is also checked: both one-sided
      endpoints and the tied endpoint are impossible, while the middle face
      forces `a*b^2+3*c^2=0` and two nonzero residual directions.  Coefficient
      extraction is now connected to the literal polynomial invariants: the
      translated defects have strict degree drop, all five exact residual
      coordinate identities are checked, the invariant loads are below the
      middle face, and the canonical expanded system satisfies the abstract
      middle classifier whenever its explicit gaps obey `g<h<2g`.  The
      residual selector now eliminates both endpoints and canonically lands
      on that middle face.  Exact discriminant, incidence, and cubic defects
      then expose the next Newton comparison: the two strict chambers force
      discriminant gaps `g+h` and `4g-h`, while the balanced chamber supplies
      its exact three-term boundary equation.
      These statements
      refine the frozen finite composition and use the two published results
      listed below only at their explicitly typed interfaces.
    license: "Apache-2.0"
    author_endorsement: "participated"
  - title: "Two-dimensional Jacobian Conjecture"
    authors:
      - "Masayoshi Nagata"
    type: "paper"
    location: "https://repository.kulib.kyoto-u.ac.jp/server/api/core/bitstreams/9ef8e868-5526-4830-b19f-543c0af09e7c/content"
    relationship: "background"
    note: >-
      Theorem 7.3 on pp. 169--170 repairs the Appelgate--Onishi argument and
      proves the exact external premise used here: a complex Keller pair whose
      total-degree gcd is prime generates the full polynomial ring.  This is
      exposed in Lean as `PlaneKellerPrimeTotalDegreeGCDRoute`; the present
      project proves the source-shear and Dirichlet reductions to that premise,
      but does not formalize Nagata's Newton-polygon proof.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "On the shape of possible counterexamples to the Jacobian Conjecture"
    authors:
      - "Jorge A. Guccione"
      - "Juan J. Guccione"
      - "Christian Valqui"
    type: "paper"
    id: "doi:10.1016/j.jalgebra.2016.08.039"
    location: "https://doi.org/10.1016/j.jalgebra.2016.08.039"
    relationship: "background"
    note: >-
      Corollary 7.9 supplies the standard-pair endpoint obstruction exposed as
      an explicit premise here.  The Lean development proves the source-shear
      adapter to that premise, not the paper's Newton-polygon proof.  Its later
      statement about B concerns the globally minimal counterexample and is
      not used as an arbitrary-pair twice-prime theorem.
    license: "unknown"
    author_endorsement: "not-contacted"


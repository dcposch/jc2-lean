status:
  scope: >-
    Fully proved: the exact unordered route classification through eleven;
    uniqueness of the primitive pair (6,9); strict recursive closure for an
    arbitrary symmetric predicate Good; its concrete instantiation for
    MvPolynomial (Fin 2) K using the actual Jacobian, partial y-degree, and
    coordinate-subalgebra generation predicates; the zero-partial-degree,
    equal-degree, and divisibility Keller routes in characteristic zero; and
    the frontier checksum showing (8,12) and (9,12) as the first new primitive
    pairs at maximum twelve.  The degree routes include a kernel-checked
    weighted-Wronskian leading-coefficient argument and triangular target
    shear.  The same argument is specialized to a genuine (6,9) Keller pair,
    deriving its nonzero square/cube common leading core without assuming a
    later landing case; independent nonzero target rescaling then normalizes
    the leading coefficients to a literal square and cube while preserving
    degree, Keller, and generation.  The next actual Jacobian row is also
    extracted: in cube-root weights it makes the alignment discriminator
    3*A-2*B constant.  A denominator-cleared version is proved directly from
    leading rows s^6,s^9 without assuming divisibility of the next
    coefficients.  Normalization and that row are packaged into an exhaustive
    genuine-source dichotomy: a normalized noncube core or a nonzero literal
    cube root satisfying the first cube row.  The literal cube/noncube split
    is then composed into a genuine (6,9) theorem conditional on closure of
    those two normalized branches.  A further source-honest composition
    matches the reviewed history split exactly: `3 ∤ deg h` is charged to a
    nondivisible-core route, while only `3 ∣ deg h` is charged to the cube and
    noncube exclusions; degree-zero cores remain in the divisible residue.
    The final assembly imports the exhaustive literal divisible-core theorem,
    adapts its coefficient-polynomial Jacobian to the genuine normalized
    MvPolynomial source, and supplies both divisible exclusion interfaces.
    For the nondivisible core it constructs the triangular source
    automorphism, proves both chain rules and Jacobian/generation invariance,
    proves the exact total degrees 2(H+3L),3(H+3L) from unique maximal
    shear-weight monomials, and uses Mathlib's Dirichlet theorem to choose
    H+3L prime.  More generally, the leading weighted-Wronskian row proves
    numerical proportionality of the two top coefficient degrees.  Exact
    source shears then prove every positive coprime partial-degree pair from
    the prime-total-degree-gcd theorem.  At partial-degree gcd two, Dirichlet
    closes the odd common-scale case and isolates the even-scale residue.  A
    finite recursive classifier restricts that residue to the five unordered
    pairs (4,6), (4,10), (6,8), (6,10), and (8,10); a checked adapter shows
    that a strong arbitrary-pair twice-prime result would close all five.  A
    second checked adapter applies the reliable standard-pair endpoint
    obstruction after a large source shear: it preserves the partial degrees
    and leading coefficients, produces normalized endpoint (2,H), and closes
    every even scale H > 2.  For each of the five remaining pairs, the top
    Jacobian row is further factored in the polynomial UFD into exact common
    powers with reduced weights (2,3), (2,5), (3,4), (3,5), or (4,5).
    Independent target rescalings remove both scalar factors, preserve Keller
    and generation, and prove that the common core has degree exactly H.
    For the first normalized pair (4,6), the next genuine Jacobian row is now
    also proved: with N=3*a_3*H-2*b_5 it gives N^2=kappa*H^5, and over an
    algebraically closed field the nonzero branch has H=h^2 and N=lambda*h^5.
    Over an arbitrary characteristic-zero differential field, the common
    depressed quartic/sextic Jacobian is expanded through all eight rows; the
    five upper rows integrate to the reviewed formulas and the next two are
    exactly the derivatives of the first integrals I_2 and I_1.  After the
    substitution U=A^2-4C, the full remaining Jacobian is proved to equal the
    two exact coefficient-curve rows dJ_2,dJ_1 followed by the reviewed
    one-form eta.  Both translated-origin boundary equations are derived by
    exact evaluation, and the four weighted-leading forms are proved to have
    the unique weighted-projective common zero [1:0:0:0].  All four full
    cleared local-chart equations are verified with no truncation, as are the
    terminal mismatch leading contradiction, the three aligned eliminated
    Newton polynomials, the shifted plane curve, its component equations and
    restricted one-form, and both monic boundary eliminants.  Presburger
    proofs replace the finite scans for all three polynomial degree cones and
    verify their one-form degree gaps.  The aligned monic quartic and octic
    are converted into exact rational-function integrality results; the
    polynomial representatives and both square/nonsquare last-row
    unit-product contradictions are also proved.  Generic three- and
    four-term Hahn-series tied-minimum lemmas and exhaustive rational
    Newton-face tables are instantiated on every term of the full cleared
    mismatch and aligned equations, including identically-zero coordinate
    subloci and arbitrary regular boundary loads.  The finite-place embedding
    and weighted-infinity theorem globalize these local contradictions at a
    root of a square common core.  For a nonsquare aligned core, the
    irreducible quadratic extension `K(x)(√H)`, its deck involution, fixed
    field, differential, and constant-field descent are constructed
    explicitly.  Deck parity kills the odd integration constants and descends
    `q`, `B²`, `rB`, and `√H B`; the boundary quartic makes the required
    representatives polynomial, and `M²=HK` closes the final row.  Thus both
    H = 0 and H = 2 normalized `(4,6)` sources are excluded completely.
    For the next `(6,8)` leaf, the complete twelve-row depressed
    sextic/octic differential Jacobian and all seven triangular Faber
    residuals are proved.  Their explicit reconstruction leaves five lower
    rows; the first two are proved to be exact derivatives of displayed
    coefficient invariants, followed by three literal one-form constraints.
    The exact raw sextic/octic affine depression is also verified, including
    the surviving septic alignment discriminator, and the literal source
    bracket/raw coefficient bridge into `k(x)` is proved.  The omitted top row
    forces the septic coefficient to be constant; it and all seven Faber
    residuals descend to the ground field and reconstruct the integrated
    octic coefficients.  At scale zero, all thirteen depressed coefficients
    are represented by literal ground polynomials and both first integrals
    descend.  Exact weighted coefficient formulas then extract the five top
    lower rows from arbitrary bounded polynomial loads and force the unique
    cubic-core boundary `B=D=0`, `C=A^2/3`, `E=A^3/27` at every positive
    integral weighted radius.  A common expansion by `x -> x^60` now clears
    the five weight denominators and constructs a positive attained maximal
    radius whenever one load is nonconstant; the nonzero terminal row is
    proved to force that nonconstancy.  The exact rational lower system is
    pulled back to a packaged polynomial system; both invariants commute with
    expansion, all three one-form rows acquire the common chain-rule factor,
    and the canonical expanded maximal face is proved nontrivial with nonzero
    top A coefficient.  In cubic transverse coordinates the four defects are
    proved to have strict degree drop.  They cannot all vanish: the exact
    quartic first integral makes the relevant loads zero, and the final
    one-form then contradicts the nonzero Keller constant.  The minimum of
    the four actual transverse degree deficits is consequently positive and
    attained by a nonzero defect, with all four sharpened degree bounds; no
    equal-drop assumption is made.  In the abstract chamber `2g<n`, the exact
    five-equation face solver forces the leading defects to satisfy `e=0` and
    `a*b=3*d`.  In `3g<n`, canonical residual-gap selection eliminates both
    endpoint faces and lands on nonzero `A,B,c,d,e` with
    `A*B^2+3*c^2=0`.  Exact invariant syzygies then lower the incidence and
    cubic defects.  The next comparison is complete: on the two strict sides
    the discriminant gaps are respectively `g+h` and `4g-h`, while the
    balanced side satisfies the exact three-term boundary equation.
    Not proved here: scalar-extension/descent, the
    prime-total-degree-gcd theorem itself, the standard-endpoint theorem
    itself, the secondary Newton-face `(6,8)` scale-zero descent, or the other
    seven normalized low-scale subcases.  The
    strong twice-prime statement is not treated as established:
    GGV 2017 proves the restriction for the globally minimal counterexample
    gcd B and records a gap in the earlier arbitrary-pair proof.

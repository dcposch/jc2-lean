status:
  scope: >-
    Fully proved: the exact unordered route classification through eleven;
    uniqueness of the primitive pair (6,9); strict recursive closure for an
    arbitrary symmetric predicate Good; its concrete instantiation for
    MvPolynomial (Fin 2) K using the actual Jacobian, partial y-degree, and
    coordinate-subalgebra generation predicates; the zero-partial-degree,
    equal-degree, and divisibility Keller routes in characteristic zero; and
    the frontier checksum showing (8,12) and (9,12) as the first new primitive
    pairs at maximum twelve.  The degree routes include a kernel-checked
    weighted-Wronskian leading-coefficient argument and triangular target
    shear.  The same argument is specialized to a genuine (6,9) Keller pair,
    deriving its nonzero square/cube common leading core without assuming a
    later landing case; independent nonzero target rescaling then normalizes
    the leading coefficients to a literal square and cube while preserving
    degree, Keller, and generation.  The next actual Jacobian row is also
    extracted: in cube-root weights it makes the alignment discriminator
    3*A-2*B constant.  A denominator-cleared version is proved directly from
    leading rows s^6,s^9 without assuming divisibility of the next
    coefficients.  Normalization and that row are packaged into an exhaustive
    genuine-source dichotomy: a normalized noncube core or a nonzero literal
    cube root satisfying the first cube row.  The literal cube/noncube split
    is then composed into a genuine (6,9) theorem conditional on closure of
    those two normalized branches.  A further source-honest composition
    matches the reviewed history split exactly: `3 ∤ deg h` is charged to a
    nondivisible-core route, while only `3 ∣ deg h` is charged to the cube and
    noncube exclusions; degree-zero cores remain in the divisible residue.
    The final assembly imports the exhaustive literal divisible-core theorem,
    adapts its coefficient-polynomial Jacobian to the genuine normalized
    MvPolynomial source, and supplies both divisible exclusion interfaces.
    For the nondivisible core it constructs the triangular source
    automorphism, proves both chain rules and Jacobian/generation invariance,
    proves the exact total degrees 2(H+3L),3(H+3L) from unique maximal
    shear-weight monomials, and uses Mathlib's Dirichlet theorem to choose
    H+3L prime.  More generally, the leading weighted-Wronskian row proves
    numerical proportionality of the two top coefficient degrees.  Exact
    source shears then prove every positive coprime partial-degree pair from
    the prime-total-degree-gcd theorem.  At partial-degree gcd two, Dirichlet
    closes the odd common-scale case and isolates the even-scale residue; a
    checked adapter shows that a strong arbitrary-pair twice-prime result
    would close it.  Not proved here: scalar-extension/descent, the
    prime-total-degree-gcd theorem itself, or that even-scale residue.  The
    strong twice-prime statement is not treated as established:
    GGV 2017 proves the restriction for the globally minimal counterexample
    gcd B and records a gap in the earlier arbitrary-pair proof.

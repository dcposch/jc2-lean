fidelity:
  divergences: >-
    The source's final theorem concerns automorphy of characteristic-zero
    bivariate Keller pairs.  The concrete Lean theorem now uses exactly that
    polynomial/Jacobian/ring-generation predicate.  The strengthened theorem
    proves the zero-degree, equal-degree, and divisibility routes, but assumes
    the gcd-at-most-two theorem.  The broad source-facing version splits the
    (6,9) leaf into explicit normalized cube and noncube closure premises; the
    refined version instead exposes the source's exact core-degree split and
    charges the deep exclusions only on `3 ∣ deg h`; `Max11Assembly` now
    imports and adapts the complete divisible-core source exclusion.  The
    nondivisible source-shear, exact-degree, and Dirichlet stack is also proved,
    reducing that branch to the canonical prime-total-degree-gcd theorem.  A
    generic version proves all coprime partial-degree pairs and the odd-scale
    gcd-two cases from the same input, reducing the former gcd-at-most-two
    premise to its even-common-scale gcd-two residue.  It does not formalize
    the published prime theorem, that residual theorem, an arbitrary-pair
    twice-prime theorem, or scalar-extension descent.  In particular, GGV
    2017's theorem about the globally minimal
    counterexample gcd B is not silently strengthened to a theorem about every
    Keller pair.  No other divergences are known.


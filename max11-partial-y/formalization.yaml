automation:
  methods:
    - method: "agent"
      models: ["OpenAI Codex (GPT-5 family)"]
      framework: "Codex"
      tool_setup: >-
        Agent-assisted extraction of the finite recursion, Lean proof
        development, exhaustive arithmetic checking, build/debug cycles, and
        source-alignment review against pinned Mathlib.
      cost:
        wall_time: "under one day of agent time"
        spend_usd: "subscription-based"
        hardware: "local Apple-silicon macOS machine and GitHub-hosted Linux CI"
      prompting_notes: >-
        The formalization isolates the exact finite composition from the
        deeper algebraic leaves so its logical dependencies are explicit.
    - method: "manual"
      models: []
      framework: "n/a"
      tool_setup: "Human mathematical direction and responsibility for publication."
      cost:
        wall_time: "not separately recorded"
        spend_usd: "not tracked"
        hardware: "local machine"
      prompting_notes: "n/a"
  spend_usd: "subscription-based"
  notes: >-
    No external human review of the Lean project has yet occurred.  The
    submitted proofs use only kernel-checked Mathlib tactics.

fidelity:
  divergences: >-
    The source's final theorem concerns automorphy of characteristic-zero
    bivariate Keller pairs.  The concrete Lean theorem now uses exactly that
    polynomial/Jacobian/ring-generation predicate.  The strengthened theorem
    proves the zero-degree, equal-degree, and divisibility routes, but assumes
    the gcd-at-most-two theorem.  The broad source-facing version splits the
    (6,9) leaf into explicit normalized cube and noncube closure premises; the
    refined version instead exposes the source's exact core-degree split and
    charges the deep exclusions only on `3 ∣ deg h`; `Max11Assembly` now
    imports and adapts the complete divisible-core source exclusion.  The
    nondivisible source-shear, exact-degree, and Dirichlet stack is also proved,
    reducing that branch to the canonical prime-total-degree-gcd theorem.  A
    generic version proves all coprime partial-degree pairs and the odd-scale
    gcd-two cases from the same input.  A second finite classifier reduces the
    former gcd-at-most-two premise to the even-scale subcase of five explicit
    pairs.  The standard-pair endpoint obstruction then reduces those five
    unbounded residues to the literal scales zero and two, and polynomial-UFD
    extraction plus target rescaling puts all ten cases into exact normalized
    common-core form.  Both `(4,6)` scales are excluded from the genuine source
    dichotomy and polynomial coefficient-curve endgames.  The `(6,8)`
    scale-zero route is proved through extraction and expansion to its
    canonical nontrivial cubic-core polynomial boundary, strict transverse
    degree drop, contradiction on the exact cubic locus, and attained positive
    secondary defect radius.  All five equations of its abstract small-gap
    face are extracted from the literal polynomial rows and applied to the
    canonical expanded system, reducing the attained residual boundary to the
    `B` or translated-`C` direction.  The next `3g<n` residual coordinates,
    exact identities, degree drops, invariant load cutoffs, abstract face
    solvers, canonical tropical selection, endpoint elimination, selected
    middle discriminant classifier, exact defect syzygies, degree cutoffs, and
    next three-way cubic-face classification are proved, but those new faces
    are not yet eliminated.  It
    does not
    formalize the published prime theorem, the standard-endpoint theorem,
    the secondary Newton-face `(6,8)` scale-zero descent, the other seven
    normalized low-scale theorems, an arbitrary-pair twice-prime theorem, or
    scalar-extension descent.  In particular, GGV
    2017's theorem about the globally minimal
    counterexample gcd B is not silently strengthened to a theorem about every
    Keller pair.  No other divergences are known.


status:
  scope: >-
    Fully proved over an algebraically closed characteristic-zero field: a
    literal polynomial source p,q in k[x][y] with outer degrees 6 and 9,
    leading coefficients s^6 and s^9, nonzero s, and nonzero constant
    coefficientwise-inner Jacobian cannot exist.  For positive-degree s, the
    proof constructs a finite normalized-coefficient pole, rules out the exact
    cubic-square normal fallback, builds the first transverse Hahn scale, and
    excludes the later fibres.  For constant s, it expands at infinity,
    exhausts all timing branches for d,c7,c5,c4,c2,c1,rho1,rho2, and excludes
    the terminal constant-core normal form.  Not
    proved here: normalization of every arbitrary Keller pair, the exhaustive
    cube/noncube handoff, the gcd-at-most-two reduction, maximum partial
    degree eleven, or JC2.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "GCD369PolynomialCubeSourceExclusion"
      file: "GCD369Cube.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"


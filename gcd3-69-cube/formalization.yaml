version: "v0.4"

project:
  name: "jc2-gcd3-69-source-cube-exclusion"
  description: >-
    Lean 4 / Mathlib proof of the source-facing polynomial-cube exclusion at
    actual partial degrees (6,9).  From literal bivariate polynomials of outer
    degrees six and nine, leading coefficients s^6 and s^9 for a common
    polynomial s, and nonzero constant Keller bracket, the formalization proves
    that no such source exists, including when s is constant.  It constructs
    the finite-pole or infinity expansion, exhausts every timing of the eight
    Faber loads through rho2, and excludes the remaining elliptic, cusp,
    zero-invariant, and constant-core terminal fibres.  It does not claim the
    reduction from an arbitrary Keller pair,
    all (6,9), maximum eleven, or the plane Jacobian conjecture.
  authors:
    - "Dan Clemens Posch"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Dan Clemens Posch"


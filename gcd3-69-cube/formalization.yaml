fidelity:
  divergences: >-
    (1) The public theorem begins with the literal normalized cube source
    whose leading coefficients are s^6 and s^9; it does not derive this
    normalization from an arbitrary plane Keller pair.  (2) The informal
    reports organize the proof by weighted trajectory strata.  Lean refines
    these into explicit strict, equality, zero-load, simple-root, double-root,
    and endpoint lemmas before composing them.  (3) The final target
    translation and zero-invariant boundary are performed on the original
    literal polynomial source, avoiding any caller-supplied boundary witness.
    No other substantive divergence is known.


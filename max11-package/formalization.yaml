fidelity:
  divergences: >-
    The informal source (the frozen campaign report) states its final theorem
    for characteristic-zero bivariate Keller pairs.  Every Lean theorem here
    additionally assumes that the field is algebraically closed
    (`[IsAlgClosed K]`); the low-scale leaves use this hypothesis, and no
    descent from the algebraically closed case to arbitrary characteristic-zero
    fields is formalized.  This is the one substantive narrowing of the
    source statement.  The Lean development uses the source's exact
    polynomial/Jacobian/ring-generation predicate (MvPolynomial.pderiv,
    degreeOf 1, Algebra.adjoin).  It does not formalize the two cited
    classical theorems; they enter only as the explicitly typed hypotheses
    `PlaneKellerPrimeTotalDegreeGCDRoute` (Nagata 1989, Theorem 7.3, in
    coordinate-free total-degree form) and
    `PlaneKellerStandardEndpointGCDObstruction` (Guccione--Guccione--Valqui
    2017, Corollary 7.9).  GGV's statement about the globally minimal
    counterexample gcd is not strengthened to an arbitrary-pair twice-prime
    theorem.  The finite composition follows the report's routing rules, but
    the source-shear bridge, the gcd-two normalization, and all five low-scale
    leaf exclusions are original to this formalization rather than
    translations of the report or of the cited papers.  The seven Comparator
    configurations certify different subsets of the development (see
    status.scope); the conditional configuration is not a weaker
    mathematical claim but the same composition with the five leaf theorems,
    each certified by its own configuration, restated as hypotheses.  No
    other divergences are known.
review:
  status: >-
    self-assessed; informal source passed campaign-internal different-model
    hostile review; Lean statements and source alignment await human audit;
    no external peer review
  reviewers:
    - "Dan Clemens Posch"
  notes: >-
    The copied hostile review predates and does not inspect the Lean code.
    This repository carries seven Comparator configurations at one commit:
    `comparator.json` (unconditional headline, solution module
    `Max11Solution`), `comparator-conditional.json` (the headline with the
    five leaf routes as hypotheses, solution module `Max11Assembly`), and
    `comparator-leaf{46,410,68,610,810}.json` (one per proved leaf route;
    solution modules `LowScale46ScaleTwo`, `Grok410ChainPromotionScratch`,
    `Grok68TerminalZeroMeetingCellScratch`,
    `Grok610ScaleZeroCubicLoadWallsScratch`,
    `Grok810RouteClosureScratch`).  Every entry states its hypotheses,
    including the algebraically-closed characteristic-zero field
    hypothesis, in the Lean statement itself; nothing is assumed silently.
    Kernel axiom reports for all seven comparator theorems and the project
    audit script find no sorryAx and no axioms beyond propext,
    Classical.choice, and Quot.sound in any module of the package.

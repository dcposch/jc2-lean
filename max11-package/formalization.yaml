status:
  scope: >-
    Field hypothesis.  Every theorem in this project is stated for an
    arbitrary algebraically closed field K of characteristic zero (Lean
    binders `{K : Type*} [Field K] [CharZero K] [IsAlgClosed K]`).  Algebraic
    closure is used in the low-scale leaves (for example to write a nonzero
    common core as H = h^2 at (4,6)); no result is claimed for
    non-algebraically-closed fields of characteristic zero, and
    scalar-extension descent is not formalized.

    Fully proved (kernel-checked; sorry count 0; axioms propext,
    Classical.choice, Quot.sound in every comparator theorem):

    (1) The abstract finite routing certificate: the exact unordered route
    classification through eleven, uniqueness of the primitive pair (6,9),
    strict recursive closure for an arbitrary symmetric predicate, the
    sharper classifier that leaves exactly five gcd-two primitives, and the
    frontier checksum identifying (8,12) and (9,12) as the first new
    primitives at maximum twelve.

    (2) Its instantiation for MvPolynomial (Fin 2) K with the actual
    Jacobian (MvPolynomial.pderiv), the actual partial y-degree
    (degreeOf 1), and coordinate-ring generation (Algebra.adjoin), including
    the zero-degree, equal-degree, and divisibility Keller routes with a
    weighted-Wronskian leading-coefficient argument and triangular target
    shear.

    (3) Reduction of every coprime partial-degree pair, of the odd common
    scale at partial-degree gcd two, and of the nondivisible (6,9) history
    route to the cited prime-total-degree-gcd theorem, by exact source shears
    and Mathlib's Dirichlet theorem; the divisible (6,9) core is discharged by
    the imported sibling exclusions.

    (4) At partial-degree gcd two with even common scale H: the cited
    standard-pair endpoint obstruction, applied after a large source shear,
    eliminates every H > 2; polynomial-UFD extraction and independent target
    rescaling then put each of the five pairs into exact normalized
    common-core form at the literal scales H = 0 and H = 2.

    (5) All ten normalized low-scale cases are excluded internally, one
    theorem per pair covering both scales:
    `proved_planeKellerNormalized46LowScaleRoute` (with
    `proved_planeKellerNormalized46ScaleTwoRoute` for the scale-two half),
    `planeKellerNormalized410LowScaleRoute_proved`,
    `proved_planeKellerNormalized68LowScaleRoute`,
    `proved_planeKellerNormalized610LowScaleRoute`, and
    `proved_planeKellerNormalized810LowScaleRoute`.  No low-scale case
    remains open.

    (6) The headline
    `Max11DegreeRoutes.Max11PlaneKellerGenerationWithClassicalInterfaces`:
    for K as above and under the two classical hypotheses
    `PlaneKellerPrimeTotalDegreeGCDRoute` and
    `PlaneKellerStandardEndpointGCDObstruction`, every Keller pair P, Q with
    degreeOf 1 P <= 11 and degreeOf 1 Q <= 11 satisfies
    Algebra.adjoin K {P, Q} = top.

    Comparator configurations at this commit (one registry entry each; each
    entry certifies exactly the theorem_names listed in its own file, and
    nothing else):
    `comparator.json` (solution module Max11Solution, 40 theorems): the
    unconditional headline (6) together with the supporting results;
    `comparator-conditional.json` (Max11Assembly, 35 theorems): the same
    composition with the five leaf routes (5) as additional explicit
    hypotheses, registered separately only because the unconditional closure
    exceeds the verifier's single-run budget;
    `comparator-leaf46.json` (LowScale46ScaleTwo, 2 theorems): exactly the
    two (4,6) leaf theorems, i.e. every normalized (4,6) leading-core source
    at scale 0 or 2 generates, over algebraically closed K of characteristic
    zero; this entry certifies nothing about the other four pairs, the
    classifier, or the headline;
    `comparator-leaf410.json`, `comparator-leaf68.json`,
    `comparator-leaf610.json`, `comparator-leaf810.json` (1 theorem each):
    the corresponding leaf theorem of (5) under the same field hypothesis.

    Not proved here: Nagata's prime-total-degree-gcd theorem and the
    Guccione--Guccione--Valqui endpoint obstruction (both are hypotheses of
    every theorem that uses them); descent from algebraically closed fields
    to arbitrary fields of characteristic zero; the plane Jacobian conjecture
    itself beyond partial y-degree eleven; and the strong arbitrary-pair
    twice-prime statement, which is not treated as established (GGV 2017
    proves it only for the globally minimal counterexample gcd).

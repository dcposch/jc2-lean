version: "v0.4"

project:
  name: "jc2-max11-partial-y-degree-closure"
  description: >-
    Lean 4 / Mathlib proof that every plane Keller pair with maximum actual
    partial y-degree at most eleven generates the polynomial ring, over an
    algebraically closed field K of characteristic zero, modulo exactly two
    cited classical theorems stated as explicit hypotheses: Nagata's
    prime-total-degree-gcd theorem and the Guccione--Guccione--Valqui
    standard-pair endpoint obstruction.  The proof is an original finite
    degree-routing composition: the zero-degree, equal-degree, divisibility,
    coprime, and odd-common-scale routes are proved from the cited theorems;
    a finite classifier reduces partial-degree gcd two to the five primitive
    pairs (4,6), (4,10), (6,8), (6,10), (8,10); the endpoint obstruction, UFD
    extraction, and target rescaling normalize each pair to literal common
    scales 0 and 2; and all ten normalized low-scale cases are excluded
    internally.  The repository carries seven Comparator configurations at
    this commit (unconditional headline, headline conditional on the five
    leaves, and one per leaf); each registry entry certifies only the
    theorems named in its own comparator file.  Every theorem requires
    algebraic closure; nothing is proved for non-algebraically-closed fields
    of characteristic zero, and no scalar-extension descent is formalized.
  authors:
    - "Dan Clemens Posch"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Dan Clemens Posch"

classification:
  arxiv: ["math.AG", "math.AC", "math.CO"]
  msc2020: ["14R15", "05A99"]


automation:
  methods:
    - method: "agent"
      models: ["OpenAI Codex (gpt-6-astra; earlier Codex agent sessions, model not recorded)", "xAI Grok 4.6", "Claude Opus 5", "Claude Fable 5.1"]
      framework: "OpenAI Codex CLI, grok CLI, Claude Code"
      tool_setup: >-
        Agent-assisted formalization throughout: extraction of the finite
        recursion, Lean proof development, exhaustive arithmetic checking,
        build/debug cycles, source-alignment review against pinned Mathlib,
        and verification-cost engineering (module splitting and merging,
        reflective degree bounds).  OpenAI Codex agents wrote the core
        definitions and the early modules (credited in the file headers of
        Max11Core.lean, Max11Challenge.lean, Solution.lean, and
        CubeCore.lean) and, as gpt-6-astra via the Codex CLI, a material
        share of the (8,10) leaf proof modules (the `Astra*` module family)
        and of the build-cost reductions.  xAI Grok 4.6 ran most of the
        low-scale leaf proof lanes via the grok CLI (`Grok*` modules).
        Claude Opus 5 handled planning and code emitters, and Claude Fable
